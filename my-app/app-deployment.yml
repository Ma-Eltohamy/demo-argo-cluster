---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kaivy-deployment
  namespace: prod
  labels:
    app: kaivy
spec:
  replicas: 3
  selector:
    matchLabels:
      app: kaivy
  template:
    metadata:
      labels:
        app: kaivy
    spec:
      containers:
      - name: kaivy
        image: nginx
